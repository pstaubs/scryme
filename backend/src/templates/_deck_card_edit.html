{# Inline editor for a deck line: choose the printing + mark it proxy/special.
    Loaded via HTMX into #ed-<card_id>; saving refreshes the whole deck page (HX-Redirect). #}
<form hx-post="/decks/{{ deck_id }}/card/{{ card_id }}" hx-swap="none"
      class="rounded-xl bg-surface-2 mx-2 my-1.5 p-3 text-sm relative">
  <button type="button" class="text-muted hover:text-fg absolute top-1.5 right-2" @click="editing = false"><i class="fa-solid fa-circle-xmark"></i></button>
  <div class="flex flex-wrap gap-x-2">
    <input type="hidden" name="format" value="{{ fmt }}">
    <div class="flex flex-col">
      <label class="text-muted text-xs" for="ed-print-{{ card_id }}">Printing</label>
      <select name="scryfall_id" id="ed-print-{{ card_id }}"
              class="max-w-[18rem] truncate rounded-full border border-edge bg-surface px-2 py-1">
        {% for p in printings %}
        <option value="{{ p.scryfall_id }}" {% if current_sid == p.scryfall_id %}selected{% endif %}>
          {{ (p.set_code or '')|upper }} · {{ p.collector_number }} — {{ p.set_name or 'Unknown set' }}{% if not p.playable %} · non-standard{% endif %}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="flex flex-col">
      <label class="text-muted text-xs" for="ed-lang-{{ card_id }}">Language</label>
      <select name="language" id="ed-lang-{{ card_id }}" class="rounded-full border border-edge bg-surface px-2 py-1 uppercase">
        {% for code, name in languages %}
        <option value="{{ code }}" {% if current_lang == code %}selected{% endif %}>{{ code|upper }} — {{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="flex flex-col">
      <label class="text-muted text-xs" for="ed-finish-{{ card_id }}">Finish</label>
      <select name="finish" id="ed-finish-{{ card_id }}" class="rounded-full border border-edge bg-surface px-2 py-1">
        <option value="normal" {% if current_finish == 'normal' %}selected{% endif %}>Normal</option>
        <option value="foil" {% if current_finish == 'foil' %}selected{% endif %}>Foil</option>
        <option value="etched" {% if current_finish == 'etched' %}selected{% endif %}>Etched</option>
      </select>
    </div>
    <label class="inline-flex items-center cursor-pointer">
      <input type="checkbox" name="proxy" value="1" {% if proxy %}checked{% endif %} class="sr-only peer">
      <div class="relative w-9 h-5 rounded-full border border-edge hover:border-accent bg-surface peer-checked:bg-accent peer-checked:after:translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
      <span class="select-none ml-1 text-sm font-medium text-heading">Proxy</span>
    </label>
    <label class="inline-flex items-center cursor-pointer">
      <input type="checkbox" name="special" value="1" {% if special %}checked{% endif %} class="sr-only peer">
      <div class="relative w-9 h-5 rounded-full border border-edge hover:border-accent bg-surface peer-checked:bg-accent peer-checked:after:translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
      <span class="select-none ml-1 text-sm font-medium text-heading">Special</span>
    </label>
    <button type="submit" class="rounded-full bg-accent px-2 py-1 font-medium text-white"><i class="fa-solid fa-check"></i> Save</button>
  </div>
</form>
