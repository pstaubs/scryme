{# Deck coaching chat modal (#172). #}
<dialogue class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" onclick="if (event.target === this) this.remove()" onkeydown="if(event.key==='Escape') this.remove()" >
  <div class="bg-surface rounded-xl w-full max-w-2xl max-h-[90vh] flex flex-col border border-edge">
    <div class="flex items-center justify-between px-4 py-2 border-b border-edge">
      <h3 class="font-semibold text-lg">{{title}}</h3>
      <form hx-post="/decks/{{ deck.id }}/chat/clear" 
            hx-target="#chat-log"
            hx-swap="innerHTML"
            class="ml-auto">
        <button type="submit" class="text-xs text-muted hover:text-fg">Clear chat</button>
      </form>
      <div class="flex justify-end gap-2">
        <button 
          type="button" 
          onclick="this.closest('dialogue').remove()" 
          class="px-4 py-2">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
    
    <form hx-post="/decks/{{ deck.id }}/ai/chat" 
          hx-target="#chat-log"
          hx-swap="beforeend"
          hx-indicator="#chat-spin">

      <div class="flex-1 overflow-y-auto p-4 max-h-[500px] min-h-[200px] flex flex-col-reverse overscroll-contain">
        <div id="chat-log" class="space-y-3 flex flex-col">
          {% include "_ai_chat_log.html" %}
        </div>
      </div>

      <div id="chat-spin" class="htmx-indicator htmx-indicator-expand text-muted px-5 pb-4"><span class="loading-animator">thinking</span></div>

      <div class="p-4 border-t border-edge flex gap-2">
        <input type="text" name="message" autofocus autocomplete="off"
              placeholder="Ask the assistant..."
              class="flex-1 min-w-0 rounded-full bg-surface-2 px-4 py-2 text-sm border border-edge hover:border-accent" />
        <button type="submit"
                class="shrink-0 rounded-full bg-accent text-white px-4 pt-1.5 pb-2.5 text-sm font-medium"><i class="fa-solid fa-paper-plane rotate-45"></i></button>
      </div>


      <div class="text-muted px-5 pb-4 flex flex-wrap gap-x-2 items-center">
        <span class="">Inclusions:</span>

        <label class="inline-flex items-center cursor-pointer">
          <input type="checkbox" name="include_deck" value="1" {% if include_deck %}checked{% endif %} class="sr-only peer">
          <div class="relative w-9 h-5 rounded-full border border-edge hover:border-accent bg-surface-2 peer-checked:bg-accent peer-checked:after:translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
          <span class="select-none ml-1 text-sm font-medium text-heading" title="Give AI access to details about this deck including its description, card list, and any derived statistics about the cards.">This Deck</span>
        </label>

        <label class="inline-flex items-center cursor-pointer">
          <input type="checkbox" name="include_collection" value="1" {% if include_collection %}checked{% endif %} class="sr-only peer">
          <div class="relative w-9 h-5 rounded-full border border-edge hover:border-accent bg-surface-2 peer-checked:bg-accent peer-checked:after:translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
          <span class="select-none ml-1 text-sm font-medium text-heading" title="Give AI access to the list of ALL cards in the collection which are not currently in a Deck.">Available in Collection</span>
        </label>

      </div>



    </form>
    
  </div>
</dialogue>
